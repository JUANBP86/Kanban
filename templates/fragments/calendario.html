{% include "fragments/calendar_meetings.html" %}

<div id="panel-calendar-task-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/60 p-4 backdrop-blur-sm"
     role="dialog" aria-modal="true" aria-labelledby="panel-calendar-task-title">
  <section class="flex max-h-[85vh] w-full max-w-xl flex-col overflow-hidden rounded-2xl border border-slate-700 bg-slate-800 text-slate-200 shadow-2xl">
    <header class="flex items-center justify-between gap-4 border-b border-slate-700 px-6 py-4">
      <div class="min-w-0">
        <p id="panel-calendar-task-board" class="mb-1 truncate text-xs text-slate-500"></p>
        <h2 id="panel-calendar-task-title" class="truncate text-base font-semibold text-slate-100">Detalle de tarea</h2>
      </div>
      <button id="panel-calendar-task-close" type="button" class="shrink-0 rounded-lg p-2 text-slate-400 transition hover:bg-slate-700 hover:text-white" aria-label="Cerrar detalles">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="space-y-5 overflow-y-auto px-6 py-5">
      <p id="panel-calendar-task-description" class="whitespace-pre-wrap text-sm text-slate-300"></p>
      <p id="panel-calendar-task-error" class="hidden rounded-lg bg-red-500/10 px-3 py-2 text-sm text-red-400" role="alert"></p>
      <div class="grid grid-cols-2 gap-4 text-sm">
        <div><p class="mb-1 text-xs text-slate-500">Estado</p><p id="panel-calendar-task-status" class="text-slate-200"></p></div>
        <div><p class="mb-1 text-xs text-slate-500">Prioridad</p><p id="panel-calendar-task-priority" class="text-slate-200"></p></div>
        <div><p class="mb-1 text-xs text-slate-500">Fecha de inicio</p><p id="panel-calendar-task-start" class="text-slate-200"></p></div>
        <div><p class="mb-1 text-xs text-slate-500">Vencimiento</p><p id="panel-calendar-task-deadline" class="text-slate-200"></p></div>
      </div>
      <div>
        <p class="mb-2 text-xs text-slate-500">Responsable</p>
        <p id="panel-calendar-task-assignee" class="text-sm text-slate-200"></p>
      </div>
      <div>
        <p class="mb-2 text-xs text-slate-500">Etiquetas</p>
        <div id="panel-calendar-task-tags" class="flex flex-wrap gap-2"></div>
      </div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales-all.global.min.js"></script>

<script>
(function() {
  "use strict";

  const modal = document.getElementById("panel-calendar-task-modal");
  const closeModal = () => {
    modal.classList.add("hidden");
    modal.classList.remove("flex");
  };
  document.getElementById("panel-calendar-task-close").addEventListener("click", closeModal);
  modal.addEventListener("click", event => {
    if (event.target === modal) closeModal();
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && !modal.classList.contains("hidden")) closeModal();
  });

  const formatDate = value => {
    if (!value) return "Sin fecha";
    const [year, month, day] = value.split("-").map(Number);
    return new Date(year, month - 1, day).toLocaleDateString("es");
  };
  const setText = (id, value) => {
    document.getElementById(id).textContent = value;
  };
  const openTaskDetails = async event => {
    const props = event.extendedProps;
    setText("panel-calendar-task-board", props.board || "");
    setText("panel-calendar-task-title", event.title);
    setText("panel-calendar-task-description", "Cargando detalles...");
    setText("panel-calendar-task-status", "");
    setText("panel-calendar-task-priority", "");
    setText("panel-calendar-task-start", "");
    setText("panel-calendar-task-deadline", "");
    setText("panel-calendar-task-assignee", "");
    document.getElementById("panel-calendar-task-tags").replaceChildren();
    const error = document.getElementById("panel-calendar-task-error");
    error.classList.add("hidden");
    modal.classList.remove("hidden");
    modal.classList.add("flex");

    try {
      const response = await fetch(`/api/tasks/${encodeURIComponent(event.id)}`);
      if (!response.ok) throw new Error("No se pudieron cargar los detalles de la tarea.");
      const task = await response.json();
      const statuses = { todo: "Por Hacer", in_progress: "En Progreso", review: "En Revisión", done: "Completada" };
      const priorities = { baja: "Baja", media: "Media", alta: "Alta" };
      setText("panel-calendar-task-title", task.title);
      setText("panel-calendar-task-description", task.description || "Sin descripción.");
      setText("panel-calendar-task-status", statuses[task.status] || task.status);
      setText("panel-calendar-task-priority", priorities[task.priority] || task.priority);
      setText("panel-calendar-task-start", formatDate(task.fecha_inicio));
      setText("panel-calendar-task-deadline", task.deadline || "Sin fecha");
      setText("panel-calendar-task-assignee", task.assignee ? task.assignee.name : "Sin asignar");
      const tags = document.getElementById("panel-calendar-task-tags");
      if (task.tags && task.tags.length) {
        task.tags.forEach(tag => {
          const chip = document.createElement("span");
          chip.className = "rounded-full px-2.5 py-1 text-xs font-medium text-white";
          chip.style.backgroundColor = tag.color;
          chip.textContent = tag.name;
          tags.appendChild(chip);
        });
      } else {
        setText("panel-calendar-task-tags", "Sin etiquetas");
      }
    } catch (requestError) {
      setText("panel-calendar-task-description", "");
      setText("panel-calendar-task-error", requestError.message);
      error.classList.remove("hidden");
    }
  };

  setTimeout(() => {
    const calEl = document.getElementById("fc-calendar-el");
    if(!calEl || typeof FullCalendar === "undefined") {
      console.warn("FullCalendar not loaded yet");
      return;
    }

    const calendar = new FullCalendar.Calendar(calEl, {
      initialView:  "dayGridMonth",
      locale:       "es",
      height:       "auto",
      headerToolbar: {
        left:   "prev,next today",
        center: "title",
        right:  "dayGridMonth,timeGridWeek,listMonth"
      },
      events: "/api/tareas",
      eventColor: "#1d4ed8"
    });
    window.initCalendarMeetings(calendar, event => {
      if(window._panelOpen) window._panelOpen("kanban");
    });
    calendar.render();
  }, 100);
})();
</script>
