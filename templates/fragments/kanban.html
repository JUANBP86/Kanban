<!-- Fragment: Kanban board (no prefixes, scoped to this div) -->
<div class="h-full flex flex-col bg-slate-900 text-slate-200">

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"></script>
  
  <style>
    .kanban-col::-webkit-scrollbar { width: 4px; }
    .kanban-col::-webkit-scrollbar-track { background: transparent; }
    .kanban-col::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .sortable-ghost { opacity: 0.2; background: #132a40 !important; border: 2px dashed #1d4ed8 !important; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    .card-enter { animation: fadeIn .22s ease-out; }
    .tag-chip.selected { outline: 2px solid #1d4ed8; outline-offset: 2px; }
    .member-chip.selected { outline: 2px solid #1d4ed8; outline-offset: 2px; }
  </style>

  <div class="flex h-full overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-56 bg-slate-800 border-r border-slate-700 flex flex-col shrink-0 overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-700 flex items-center gap-2">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Tableros</span>
      </div>
      <div class="flex-1 overflow-y-auto py-2 px-2 space-y-1">
        <div id="boards-list" class="space-y-1"></div>
      </div>
      <div class="p-2 border-t border-slate-700 space-y-1">
        <button id="btn-new-board" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-indigo-400 hover:bg-indigo-900/40 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>Nuevo tablero
        </button>
        <button id="btn-manage-members" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-700 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Personas
        </button>
        <button id="btn-manage-tags" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-700 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a4 4 0 014-4z"/></svg>Etiquetas
        </button>
      </div>
    </aside>

    <!-- Main area -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="bg-slate-800 border-b border-slate-700 px-5 py-3 shrink-0">
        <div class="flex items-center justify-between">
          <div>
            <h2 id="board-title" class="text-base font-semibold text-white">—</h2>
            <p id="board-desc" class="text-xs text-slate-500"></p>
          </div>
          <div class="flex items-center gap-2">
            <div id="board-members-bar" class="flex -space-x-2"></div>
            <button id="btn-new-task" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors shadow">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>Nueva tarea
            </button>
          </div>
        </div>
        <div class="flex items-center gap-3 mt-2">
          <span class="text-xs text-slate-500 whitespace-nowrap">Progreso</span>
          <div class="flex-1 bg-slate-700 rounded-full h-1.5 overflow-hidden">
            <div id="progress-bar" class="h-1.5 rounded-full bg-gradient-to-r from-indigo-500 to-emerald-500 transition-all duration-500" style="width:0%"></div>
          </div>
          <span id="progress-label" class="text-xs font-semibold text-slate-400 whitespace-nowrap">0 / 0</span>
        </div>
      </header>

      <!-- Columns -->
      <main id="board-area" class="flex-1 overflow-x-auto overflow-y-hidden px-4 py-4">
        <div class="grid grid-cols-4 gap-3 h-full min-w-[800px]">
          <div class="flex flex-col bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
            <div class="px-3 py-2.5 flex items-center justify-between border-b border-slate-700">
              <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-slate-500"></span><h3 class="text-xs font-bold text-slate-400 uppercase tracking-wide">Por Hacer</h3></div>
              <span id="count-todo" class="text-xs font-bold text-slate-500 bg-slate-700 rounded-full px-2 py-0.5">0</span>
            </div>
            <div id="col-todo" data-status="todo" class="kanban-col flex-1 p-2.5 space-y-2.5 overflow-y-auto min-h-[80px]"></div>
          </div>
          <div class="flex flex-col bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
            <div class="px-3 py-2.5 flex items-center justify-between border-b border-slate-700">
              <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-blue-500"></span><h3 class="text-xs font-bold text-slate-400 uppercase tracking-wide">En Progreso</h3></div>
              <span id="count-in_progress" class="text-xs font-bold text-slate-500 bg-slate-700 rounded-full px-2 py-0.5">0</span>
            </div>
            <div id="col-in_progress" data-status="in_progress" class="kanban-col flex-1 p-2.5 space-y-2.5 overflow-y-auto min-h-[80px]"></div>
          </div>
          <div class="flex flex-col bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
            <div class="px-3 py-2.5 flex items-center justify-between border-b border-slate-700">
              <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-amber-500"></span><h3 class="text-xs font-bold text-slate-400 uppercase tracking-wide">En Revisión</h3></div>
              <span id="count-review" class="text-xs font-bold text-slate-500 bg-slate-700 rounded-full px-2 py-0.5">0</span>
            </div>
            <div id="col-review" data-status="review" class="kanban-col flex-1 p-2.5 space-y-2.5 overflow-y-auto min-h-[80px]"></div>
          </div>
          <div class="flex flex-col bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
            <div class="px-3 py-2.5 flex items-center justify-between border-b border-slate-700">
              <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-500"></span><h3 class="text-xs font-bold text-slate-400 uppercase tracking-wide">Completado</h3></div>
              <span id="count-done" class="text-xs font-bold text-slate-500 bg-slate-700 rounded-full px-2 py-0.5">0</span>
            </div>
            <div id="col-done" data-status="done" class="kanban-col flex-1 p-2.5 space-y-2.5 overflow-y-auto min-h-[80px]"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Empty state -->
  <div id="empty-state" class="hidden fixed inset-0 flex items-center justify-center pointer-events-none z-10">
    <div class="text-center pointer-events-auto">
      <div class="w-14 h-14 rounded-2xl bg-indigo-900/50 flex items-center justify-center mx-auto mb-3">
        <svg class="w-7 h-7 text-indigo-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
      </div>
      <p class="text-slate-400 text-sm mb-3">No tienes tableros aún.</p>
      <button onclick="document.getElementById('btn-new-board').click()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-lg">Crear primer tablero</button>
    </div>
  </div>
</div>

<script>
(function() {
"use strict";

const COLUMNS = ["todo","in_progress","review","done"];
const STATUS_LABEL = { todo:"Por Hacer", in_progress:"En Progreso", review:"En Revisión", done:"Completado" };
const PRIORITY_LABEL = { alta:"Alta", media:"Media", baja:"Baja" };
const PRIORITY_CLASS = { alta: "bg-red-900/60 text-red-300 border border-red-700", media: "bg-amber-900/60 text-amber-300 border border-amber-700", baja: "bg-green-900/60 text-green-300 border border-green-700" };
const DL_CLASS = { overdue:"text-red-400 font-semibold", today:"text-orange-400 font-semibold", soon:"text-amber-400", ok:"text-slate-500" };
const DL_ICON = { overdue:"⚠️", today:"🔥", soon:"⏰", ok:"📅" };

let currentBoardId = null;
let allBoards = [];
let allMembers = [];
let allTags = [];

const COL = id => document.getElementById(`col-${id}`);
const CNT = id => document.getElementById(`count-${id}`);

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function avatar(m, size="w-7 h-7"){
  const initials = m.name.split(' ').length >= 2 ? (m.name.split(' ')[0][0] + m.name.split(' ').slice(-1)[0][0]).toUpperCase() : m.name.slice(0,2).toUpperCase();
  return `<span class="${size} rounded-full flex items-center justify-center text-white text-[10px] font-bold border-2 border-slate-700 shrink-0" style="background-color:${esc(m.color)}" title="${esc(m.name)}">${esc(initials)}</span>`;
}

function buildCard(task){
  const card = document.createElement("div");
  card.className = "card-enter bg-slate-700/60 hover:bg-slate-700 border border-slate-600 rounded-xl shadow-sm hover:shadow-lg transition-all cursor-grab active:cursor-grabbing p-3 select-none group";
  card.dataset.id = task.id;

  const tagsHtml = task.tags && Array.isArray(task.tags) && task.tags.length ? `<div class="flex flex-wrap gap-1 mb-2">${task.tags.map(t=>`<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-full text-white" style="background-color:${esc(t.color)}">${esc(t.name)}</span>`).join("")}</div>` : "";

  let dlHtml = "";
  if(task.deadline){
    dlHtml = `<span class="text-[10px] ${DL_CLASS[task.dl_status]||"text-slate-500"} flex items-center gap-0.5"><span>${DL_ICON[task.dl_status]||"📅"}</span>${task.dl_status==="overdue"?"Venció: "+task.deadline:task.dl_status==="today"?"Hoy":task.deadline}</span>`;
  }

  const assigneeHtml = task.assignee ? `<div class="flex items-center gap-1 mt-1">${avatar(task.assignee,"w-5 h-5")}<span class="text-[10px] text-slate-400">${esc(task.assignee.name)}</span></div>` : "";

  card.innerHTML = `
    <div class="flex items-start justify-between gap-2 mb-1">
      <p class="text-sm font-semibold text-slate-200 leading-snug line-clamp-2 flex-1">${esc(task.title)}</p>
    </div>
    ${task.description?`<p class="text-xs text-slate-500 line-clamp-2 mb-1">${esc(task.description)}</p>`:""}
    ${tagsHtml}${assigneeHtml}
    <div class="flex items-center justify-between mt-2 flex-wrap gap-1">
      <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${PRIORITY_CLASS[task.priority]}">${PRIORITY_LABEL[task.priority]}</span>
      <div class="flex items-center gap-2">${dlHtml}</div>
    </div>`;
  return card;
}

function renderBoard(grouped){
  COLUMNS.forEach(s => {
    COL(s).innerHTML = "";
    (grouped[s]||[]).forEach(t => COL(s).appendChild(buildCard(t)));
    CNT(s).textContent = (grouped[s]||[]).length;
  });
  const total = COLUMNS.reduce((s,c)=>s+(grouped[c]||[]).length,0);
  const done = (grouped["done"]||[]).length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById("progress-bar").style.width = pct+"%";
  document.getElementById("progress-label").textContent = `${done} / ${total}`;
}

async function loadTasks(){
  if(!currentBoardId) return;
  try{
    const res = await fetch(`/api/boards/${currentBoardId}/tasks`);
    if(!res.ok) throw new Error();
    renderBoard(await res.json());
  }catch{ alert("Error cargando tareas."); }
}

COLUMNS.forEach(status => {
  Sortable.create(COL(status), {
    group:"kanban", animation:180, ghostClass:"sortable-ghost",
    onEnd(evt){
      const dCol=evt.to, sCol=evt.from;
      const dSt=dCol.dataset.status, sSt=sCol.dataset.status;
      const dItems=[...dCol.querySelectorAll("[data-id]")].map((el,i)=>({id:+el.dataset.id,status:dSt,position:i}));
      let payload=dItems;
      if(sCol!==dCol){
        const sItems=[...sCol.querySelectorAll("[data-id]")].map((el,i)=>({id:+el.dataset.id,status:sSt,position:i}));
        payload=[...dItems,...sItems];
      }
      fetch("/api/tasks/reorder",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).catch(()=>loadTasks());
    }
  });
});

async function loadBoards(){
  const res = await fetch("/api/boards");
  allBoards = await res.json();
  const c = document.getElementById("boards-list");
  c.innerHTML = allBoards.map(b=>`
    <div class="group flex items-center gap-2 px-2 py-2 rounded-lg cursor-pointer transition-colors ${b.id===currentBoardId?"bg-indigo-900/50 text-indigo-300":"text-slate-400 hover:bg-slate-700"}" data-board-id="${b.id}">
      <span class="w-2 h-2 rounded-full shrink-0" style="background-color:${esc(b.color)}"></span>
      <span class="text-xs font-medium truncate flex-1">${esc(b.name)}</span>
    </div>`).join("");
  
  if(allBoards.length && !currentBoardId) selectBoard(allBoards[0].id);
  else if(!allBoards.length) document.getElementById("empty-state").classList.remove("hidden");
}

async function selectBoard(id){
  currentBoardId = id;
  const b = allBoards.find(x=>x.id===id);
  if(b){
    document.getElementById("board-title").textContent = b.name;
    document.getElementById("board-desc").textContent = b.description || "";
  }
  await loadMembers();
  await loadTasks();
}

async function loadMembers(){
  const res = await fetch("/api/members");
  allMembers = await res.json();
  const bar = document.getElementById("board-members-bar");
  bar.innerHTML = allMembers.slice(0,5).map(m=>avatar(m,"w-7 h-7")).join("")+(allMembers.length>5?`<span class="w-7 h-7 rounded-full bg-slate-600 border-2 border-slate-700 flex items-center justify-center text-[10px] font-bold text-slate-400">+${allMembers.length-5}</span>`:"");
}

document.getElementById("boards-list").addEventListener("click", async e => {
  const row = e.target.closest("[data-board-id]");
  if(row) selectBoard(+row.dataset.boardId);
});

document.getElementById("btn-manage-members").addEventListener("click", async () => {
  alert("Gestión de personas: "+allMembers.map(m=>m.name).join(", "));
});

document.getElementById("btn-manage-tags").addEventListener("click", async () => {
  alert("Gestión de etiquetas");
});

// Init
(async function(){
  await loadBoards();
})();

})();
</script>
