<!DOCTYPE html>
<html lang="es" class="{{ 'light-theme' if current_user.is_authenticated and current_user.theme == 'light' else 'dark' }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Tablero Kanban{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#1d4ed8',
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    .sidebar-item.active {
      background: rgba(37,99,235,0.16);
      color: #60a5fa;
    }
    .sidebar-item.active svg {
      color: #60a5fa;
    }

    html.dark .bg-slate-900 { background-color: #0b1f33 !important; }
    html.dark .bg-slate-800 { background-color: #132a40 !important; }
    html.dark .bg-slate-700 { background-color: #1c344b !important; }
    html.dark .bg-slate-600 { background-color: #2b4660 !important; }
    html.dark .border-slate-800,
    html.dark .border-slate-700,
    html.dark .border-slate-600 { border-color: #29445d !important; }
    html.dark .bg-indigo-600,
    html.dark .bg-indigo-500,
    html.dark .bg-violet-600 { background-color: #1d4ed8 !important; }
    html.dark [class~="hover:bg-indigo-500"]:hover,
    html.dark [class~="hover:bg-indigo-400"]:hover,
    html.dark [class~="hover:bg-indigo-600"]:hover,
    html.dark [class~="hover:bg-violet-500"]:hover { background-color: #1e40af !important; }
    html.dark .text-indigo-300,
    html.dark .text-indigo-400,
    html.dark .text-indigo-500,
    html.dark .text-violet-400 { color: #93c5fd !important; }
    html.dark .border-indigo-500,
    html.dark .border-indigo-600,
    html.dark .border-indigo-700 { border-color: #3b82f6 !important; }
    html.dark .bg-indigo-900\/50,
    html.dark .bg-indigo-900\/40 { background-color: rgba(29,78,216,0.2) !important; }

    html.light-theme body,
    html.light-theme .bg-slate-900 {
      background-color: #edf3f9 !important;
    }
    html.light-theme body {
      color: #1e293b !important;
    }
    html.light-theme .bg-slate-800 {
      background-color: #ffffff !important;
    }
    html.light-theme .bg-slate-700 {
      background-color: #e5edf5 !important;
    }
    html.light-theme .bg-slate-700\/80,
    html.light-theme .bg-slate-700\/50 {
      background-color: #e5edf5 !important;
    }
    html.light-theme .bg-slate-600 {
      background-color: #cbd5e1 !important;
    }
    html.light-theme .bg-slate-900\/70 {
      background-color: #e2e8f0 !important;
    }
    html.light-theme .border-slate-800,
    html.light-theme .border-slate-700,
    html.light-theme .border-slate-600 {
      border-color: #c7d5e3 !important;
    }
    html.light-theme .text-slate-200,
    html.light-theme .text-slate-300 {
      color: #334155 !important;
    }
    html.light-theme .text-slate-400,
    html.light-theme .text-slate-500 {
      color: #64748b !important;
    }
    html.light-theme .text-white {
      color: #1e293b !important;
    }
    html.light-theme .text-slate-100 {
      color: #1e293b !important;
    }
    html.light-theme .bg-indigo-900\/50,
    html.light-theme .bg-indigo-900\/40 {
      background-color: #dbeafe !important;
    }
    html.light-theme .text-indigo-300 {
      color: #1e40af !important;
    }
    html.light-theme .text-indigo-400 {
      color: #1d4ed8 !important;
    }
    html.light-theme .text-violet-400 { color: #1d4ed8 !important; }
    html.light-theme .bg-indigo-600,
    html.light-theme .bg-indigo-500,
    html.light-theme .bg-violet-600 { background-color: #1d4ed8 !important; }
    html.light-theme [class~="hover:bg-indigo-500"]:hover,
    html.light-theme [class~="hover:bg-indigo-400"]:hover,
    html.light-theme [class~="hover:bg-indigo-600"]:hover,
    html.light-theme [class~="hover:bg-violet-500"]:hover { background-color: #1e40af !important; }
    html.light-theme .border-indigo-500,
    html.light-theme .border-indigo-600,
    html.light-theme .border-indigo-700 { border-color: #3b82f6 !important; }
    html.light-theme .bg-red-900\/40 {
      background-color: #fee2e2 !important;
    }
    html.light-theme .bg-amber-900\/40 {
      background-color: #fef3c7 !important;
    }
    html.light-theme .bg-emerald-900\/40 {
      background-color: #d1fae5 !important;
    }
    html.light-theme .text-red-300 {
      color: #b91c1c !important;
    }
    html.light-theme .text-amber-300 {
      color: #b45309 !important;
    }
    html.light-theme .text-emerald-300 {
      color: #047857 !important;
    }
    html.light-theme button.text-white,
    html.light-theme a.text-white,
    html.light-theme .bg-indigo-600.text-white,
    html.light-theme .bg-indigo-500.text-white {
      color: #ffffff !important;
    }
    html.light-theme input,
    html.light-theme select {
      background-color: #ffffff !important;
      color: #0f172a !important;
    }
    html.light-theme main h1,
    html.light-theme main h2,
    html.light-theme main h3 {
      color: #0f172a !important;
    }
    html.light-theme .sidebar-item.active {
      background: rgba(29,78,216,0.1);
      color: #1d4ed8;
    }
    html.dark ::-webkit-scrollbar-thumb { background: #29445d; }
    html.dark ::-webkit-scrollbar-thumb:hover { background: #35516b; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex overflow-hidden">

  <!-- ═══════════════════════════════════════════════════ SIDEBAR -->
  <aside id="app-sidebar"
    class="w-16 bg-slate-900 border-r border-slate-800 flex flex-col items-center py-4 gap-1 shrink-0 z-30 fixed inset-y-0 left-0">

    <!-- Logo -->
    <a href="{{ url_for('dashboard') }}" class="mb-4 flex items-center justify-center">
      <img src="{{ url_for('static', filename='logo.png') }}"
           alt="Logo" class="h-8 w-8 object-contain rounded-lg" />
    </a>

    <!-- Nav -->
    <nav class="flex flex-col items-center gap-1 flex-1 w-full px-2" aria-label="Navegación">
      <!-- Dashboard -->
      <a href="{{ url_for('dashboard') }}"
         class="sidebar-item {% if request.endpoint == 'dashboard' %}active{% endif %}
                w-full flex flex-col items-center gap-1 py-2 rounded-xl text-slate-400
                hover:bg-slate-800 hover:text-slate-200 transition-colors group"
         title="Dashboard">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span class="text-[9px] font-medium leading-none">Inicio</span>
      </a>

      <!-- Kanban -->
      <a href="{{ url_for('kanban') }}"
         class="sidebar-item {% if request.endpoint == 'kanban' %}active{% endif %}
                w-full flex flex-col items-center gap-1 py-2 rounded-xl text-slate-400
                hover:bg-slate-800 hover:text-slate-200 transition-colors group"
         title="Kanban">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"/>
        </svg>
        <span class="text-[9px] font-medium leading-none">Kanban</span>
      </a>

      <!-- Calendario -->
      <a href="{{ url_for('calendario') }}"
         class="sidebar-item {% if request.endpoint == 'calendario' %}active{% endif %}
                w-full flex flex-col items-center gap-1 py-2 rounded-xl text-slate-400
                hover:bg-slate-800 hover:text-slate-200 transition-colors group"
         title="Calendario">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        <span class="text-[9px] font-medium leading-none">Calendario</span>
      </a>

      {% if current_user.is_admin %}
      <a href="{{ url_for('users') }}"
         class="sidebar-item {% if request.endpoint == 'users' %}active{% endif %}
                w-full flex flex-col items-center gap-1 py-2 rounded-xl text-slate-400
                hover:bg-slate-800 hover:text-slate-200 transition-colors group"
         title="Usuarios">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2m8-10a4 4 0 100-8 4 4 0 000 8zm12 10v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
        </svg>
        <span class="text-[9px] font-medium leading-none">Usuarios</span>
      </a>
      {% endif %}
    </nav>

    <!-- Footer -->
    <div class="flex flex-col items-center gap-2 w-full px-2 pt-2 border-t border-slate-800">
      <form method="post" action="{{ url_for('set_theme') }}" class="w-full">
        <input type="hidden" name="theme" value="{{ 'dark' if current_user.theme == 'light' else 'light' }}">
        <input type="hidden" name="next" value="{{ request.path }}">
        <button type="submit"
          class="w-full flex flex-col items-center gap-1 py-2 rounded-xl text-slate-500
                 hover:bg-slate-800 hover:text-slate-200 transition-colors"
          title="Cambiar a tema {{ 'oscuro' if current_user.theme == 'light' else 'claro' }}">
          {% if current_user.theme == 'light' %}
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.36 6.36l-.7-.7M6.34 6.34l-.7-.7m12.72 0l-.7.7M6.34 17.66l-.7.7M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          <span class="text-[9px] font-medium leading-none">Oscuro</span>
          {% else %}
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
          <span class="text-[9px] font-medium leading-none">Claro</span>
          {% endif %}
        </button>
      </form>
      <div class="flex flex-col items-center gap-0.5" title="{{ current_user.full_name }}">
        <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold text-white">
          {{ current_user.full_name[0].upper() }}
        </div>
        <span class="text-[9px] text-slate-500 max-w-[52px] truncate">{{ current_user.full_name }}</span>
      </div>
      <form method="post" action="{{ url_for('logout') }}" class="w-full">
        <button type="submit"
          class="w-full flex flex-col items-center gap-1 py-2 rounded-xl text-slate-500
                 hover:bg-red-900/30 hover:text-red-400 transition-colors"
          title="Cerrar sesión">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          <span class="text-[9px] font-medium leading-none">Salir</span>
        </button>
      </form>
    </div>
  </aside>

  <!-- ═══════════════════════════════════════════════════ MAIN -->
  <div class="flex-1 flex flex-col ml-16 min-h-0 {% if request.endpoint == 'kanban' %}h-screen overflow-hidden{% else %}min-h-screen overflow-auto{% endif %}">
    {% block content %}{% endblock %}
  </div>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
